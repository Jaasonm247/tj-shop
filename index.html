/* ---- Live stock: on-hand, reserved, inbound (matches the tracker's math) --- */
// Inventory/orders are keyed by product NAME; the shop knows product id -> name via the live-merged catalog.
// vials physically on the shelf for a product name
function stockOnHand(inv, name, sku) {
  return (inv || []).filter((b) => (sku && b.sku_code) ? b.sku_code === sku : b.sku === name)
    .reduce((a, b) => a + (b.vials_left || 0), 0);
}
// units spoken for by open (not completed) orders, incl. paid pre-buys — they hold stock
function stockReserved(orders, name, sku) {
  let r = 0;
  (orders || []).forEach((o) => {
    if (o.closed) return;
    (o.lines || []).forEach((l) => {
      if ((sku && l.sku_code) ? l.sku_code === sku : l.sku === name) {
        const picked = l.pickedQty != null ? (parseInt(l.pickedQty, 10) || 0) : (l.picked ? (parseInt(l.qty, 10) || 0) : 0);
        r += Math.max(0, (parseInt(l.qty, 10) || 0) - picked);
      }
    });
  });
  return r;
}
// vials on the way: kits on POs not yet received, x vials/kit, mapped supplier->sellable name
const SUPPLIER_TO_SELLABLE_SHOP = {
  "KLOW 80mg": "KLOW 80mg Blend", "Melanotan II 10mg": "Melanotan II (MT2)", "MOTS-c 40mg": "MOTS-c",
  "Tesamorelin 10mg": "Tesamorelin", "Selank 10mg": "Selank", "Semax 10mg": "Semax", "HCG 10000iu": "HCG",
  "PT-141 10mg": "PT-141", "GHK-Cu 100mg": "GHK-Cu", "Glutathione 1500mg": "Glutathione",
  "BPC+TB Blend 20mg": "Wolverine Stack (BPC+TB)", "CJC-1295 NoDAC+Ipa 20mg": "CJC-1295 + Ipamorelin",
  "Kisspeptin-10 10mg": "Kisspeptin-10",
};
function stockInbound(pos, name) {
  let v = 0;
  (pos || []).forEach((po) => {
    if (po.received || po.status === "Closed") return; // only not-yet-received POs are inbound
    const vialsPerKit = (po.cfg && po.cfg.vials) || 10;
    (po.lines || []).forEach((l) => {
      const sellable = SUPPLIER_TO_SELLABLE_SHOP[l.name] || l.name;
      if (sellable === name) v += (parseInt(l.qtyKits, 10) || 0) * vialsPerKit;
    });
  });
  return v;
}
// Build a per-product-id stock map: { p01: { onHand, reserved, available, inbound } }
// Nasal sprays are made from the in-stock parent vial, so their availability mirrors the parent.
// Made-to-order items draw stock from their source vial — keyed by SKU so renames can't break it.
const STOCK_ALIAS_SKU = { "TJ-SELANK-NASAL": "TJ-SELANK-10", "TJ-SEMAX-NASAL": "TJ-SEMAX-10" };
const STOCK_ALIAS = { "Selank Nasal Spray": "Selank 10mg", "Semax Nasal Spray": "Semax 10mg" }; // legacy fallback
function buildStockMap(inv, orders, pos, products) {
  const m = {};
  (products || []).forEach((p) => {
    if (p.isKit || p.components) return; // stacks derived in a second pass
    const sku = STOCK_ALIAS_SKU[p.sku_code] || p.sku_code;
    const name = STOCK_ALIAS[p.name] || p.name;
    const onHand = stockOnHand(inv, name, sku);
    const reserved = stockReserved(orders, name, sku);
    m[p.id] = { onHand, reserved, available: onHand - reserved, inbound: stockInbound(pos, name) };
  });
  // Stacks: available = min(component availabilities); unknown components don't block.
  (products || []).forEach((p) => {
    if (!(p.isKit || p.components)) return;
    let min = Infinity, anyKnown = false, unresolved = false;
    stackRefs(p).forEach((ref) => {
      const comp = resolveRef(products, ref);
      if (!comp) { unresolved = true; return; }   // a component we cannot identify must not be ignored
      const st = m[comp.id];
      if (st && typeof st.available === "number") { anyKnown = true; min = Math.min(min, st.available); }
    });
    // If any component is unresolved, availability is UNKNOWN, not "whatever the others said".
    m[p.id] = { onHand: 0, reserved: 0, available: (unresolved || !anyKnown) ? null : (min === Infinity ? null : min), inbound: 0 };
  });
  return m;
}

/* ---- Pricing comes from the database (store -> tj_pricing_v1) ---------------

let DISCOUNT_TIERS = [
  { min: 400, pct: 15, label: "15% off — order over $400" },
  { min: 300, pct: 10, label: "10% off — order over $300" },
  { min: 200, pct: 5,  label: "5% off — order over $200" },
];
let PRICING_SOURCE = "fallback";        // "tj_pricing_v1" once the live ladder is in

function applyPricing(pricing) {
  if (!pricing || typeof pricing !== "object") return false;
  const tiers = Array.isArray(pricing.volume_tiers) ? pricing.volume_tiers : null;
  if (tiers && tiers.length) {
    // Sort defensively: discountFor takes the FIRST match, so highest min must come first.
    const clean = tiers
      .filter((t) => t && Number.isFinite(Number(t.min)) && Number.isFinite(Number(t.pct)))
      .map((t) => ({ min: Number(t.min), pct: Number(t.pct), label: t.label || `${t.pct}% off — order over $${t.min}` }))
      .sort((a, b) => b.min - a.min);
    // Only adopt a ladder that SURVIVED validation. If every row was malformed, clean is []
    // and assigning it would silently remove every volume discount from the storefront.
    if (clean.length) DISCOUNT_TIERS = clean;
  }
  if (Number.isFinite(Number(pricing.delivery_fee))) DELIVERY_FEE = Number(pricing.delivery_fee);
  if (Number.isFinite(Number(pricing.recon_fee)))    RECON_FEE = Number(pricing.recon_fee);
  if (Number.isFinite(Number(pricing.recon_per_vial))) RECON_PER_VIAL = Number(pricing.recon_per_vial);
  if (Number.isFinite(Number(pricing.cash_pct)))     CASH_PCT = Number(pricing.cash_pct);
  PRICING_SOURCE = "tj_pricing_v1";
  return true;
}

/* ---- Catalog (prices in CAD) ---------------------------------------------- */
/* ---- CATALOG ------------------------------------------------------------
   There is deliberately no hardcoded product list here. There used to be, and
   it was a liability: it rendered 20 prices instantly and the database then
   corrected them. On a slow phone — or any failed request — the customer read
   the typed copy and never saw the correction. It carried a fossil:
   "CJC-1295 + Ipamorelin · 20mg vial · $85" — a product that had since been
   split into a 10mg at $68 and a 20mg at $125. $85 existed in no row of the
   database. And 13 of its 24 names carried no strength at all ("Tesamorelin"),
   so TJ-TESA-10 and TJ-TESA-20 were indistinguishable to a customer.
   The catalog now comes from the database, or it does not come at all.
   ------------------------------------------------------------------------ */
// Merge live catalog (tj_prd_v1) over the hardcoded base: override price/name/unit by id,
// append newly-promoted products, and skip name-duplicates (e.g. supplies) to avoid doubles.
// Show the vial size as part of the bold product name, consistently, and keep the grey line to the form only.
function sizeFromUnit(unit) { const m = (unit || "").match(/^([\d,]+\s*(?:mg|mcg|iu|ml))/i); return m ? m[1].replace(/\s+/g, "") : ""; }
function displayName(p) {
  const sz = sizeFromUnit(p.unit);
  if (!sz) return p.name;
  const flat = p.name.replace(/\s+/g, "").toLowerCase();
  return flat.includes(sz.toLowerCase()) ? p.name : p.name + " " + sz;
}
function unitForm(unit) { return (unit || "").replace(/^[\d,]+\s*(?:mg|mcg|iu|ml)\s*/i, "").trim() || (unit || ""); }

// Group rule: cluster every product with its other sizes (Retatrutide 10/20/30/40 together, etc.)
function baseName(n) { return (n || "").replace(/\s*[\d,]+\s*(?:mg|mcg|iu|ml)\b.*/i, "").replace(/\s*Nasal Spray$/i, "").trim() || n; }
function sizeKey(n) { const m = (n || "").match(/([\d,]+)\s*(?:mg|mcg|iu|ml)/i); return [/Nasal Spray/i.test(n) ? 1 : 0, m ? parseInt(m[1].replace(/,/g, ""), 10) : 0]; }
function byNameThenSize(a, b) {
  const an = baseName(a.name), bn = baseName(b.name);
  if (an !== bn) return an.localeCompare(bn);
  const [ax, ay] = sizeKey(a.name), [bx, by] = sizeKey(b.name);
  return ax - bx || ay - by;
}

/* ---- One card per compound: display name, size label, molecule blurb -------
   THE core content rule: talk about the molecule, not the vial size. A compound
   with several sizes is ONE card; sizes appear only where price is shown. */
function compoundName(p) {
  let b = baseName(p.name);
  b = b.replace(/\s*\([^)]*\)\s*$/, "").trim();
  return b;
}
function sizeLabel(p) {
  if (/nasal spray/i.test(p.name)) return "Nasal spray";
  const m = ((p.name || "") + " " + (p.unit || "")).match(/([\d,]+)\s*(mg|mcg|iu|ml)/i);
  return m ? (m[1].replace(/\s+/g, "") + m[2].toLowerCase()) : (unitForm(p.unit) || "");
}

   Copy AUTHORED by the Digital & Growth executive — dosing guidance in front of

const CAT_SHORT = { "Weight Loss & Metabolic": "Weight Loss", "Healing, Recovery & Immune": "Healing", "Anti-Aging & Longevity": "Longevity", "Cognitive & Sleep": "Cognitive", "Skin & Cosmetic": "Skin", "Sexual & Hormonal Health": "Sexual/Hormonal", "Stacks & Bundles": "Stacks", "More": "More", "Supplies": "Supplies" };
const catLabel = (c) => CAT_SHORT[c] || c;
function categoryOf(p) {
  if (p.isKit || p.components) return "Stacks & Bundles";
  if (p.category) {
    const c = p.category === "Stacks" ? "Stacks & Bundles" : p.category;
    if (SHOP_CATS.includes(c)) return c;
  }
  const n = (p.name || "").toLowerCase(), u = (p.unit || "").toLowerCase();
  if (p.cat === "supply" || /bac water|needle|syringe/.test(n)) return "Supplies";
  if (/stack/.test(u)) return "Stacks & Bundles"; // 2-vial bundles carry a "…stack" unit; Wolverine's unit is "20mg vial"
  const b = baseName(p.name).toLowerCase();
  const has = (...xs) => xs.some((x) => b.startsWith(x));
  if (has("retatrutide", "tesamorelin", "mots", "semaglutide", "tirzepatide", "mazdutide", "cagrilintide", "survodutide")) return "Weight Loss & Metabolic";
  if (has("klow", "bpc-157", "wolverine", "thymosin", "tb-500", "ll-37", "kpv", "thymalin", "ara-290", "bpc+tb")) return "Healing, Recovery & Immune";
  if (has("cjc-1295", "epitalon", "nad", "ss-31", "glutathione", "sermorelin", "ipamorelin", "ghrp", "hexarelin", "igf-1", "5-amino")) return "Anti-Aging & Longevity";
  if (has("selank", "semax", "dsip", "p21", "humanin")) return "Cognitive & Sleep";
  if (has("ghk", "snap-8", "melanotan", "mt-2", "mt2", "aod")) return "Skin & Cosmetic";
  if (has("pt-141", "kisspeptin", "hcg", "oxytocin", "triptorelin")) return "Sexual & Hormonal Health";
  return "More";
}

function catalogFrom(prd) {
  // NO FALLBACK. No data -> no catalog -> the UI shows a skeleton, then a retry.
  // The old signature took a hardcoded `base` and opened with
  // `if (!prd.length) return base;` — that line is precisely how the Shop came
  // to advertise a $85 price that existed in no row of the database.
  if (!Array.isArray(prd) || !prd.length) return null;
  const isHidden = (x) => x.discontinued === true || x.internal === true || x.type === "internal";
  const out = [];
  prd.forEach((x) => {
    if (isHidden(x)) return;
    const isSupply = /BAC|NDL/i.test(x.sku_code || "") || /water|needle/i.test(x.name || "");
    out.push({
      id: x.id, sku_code: x.sku_code, name: x.name, unit: x.unit || "",
      price: Number(x.sell), cat: isSupply ? "supply" : "peptide", category: x.category,
      isKit: x.isKit === true, components: x.components || null,
      component_skus: x.component_skus || null, desc: x.desc || "",
      prebuy: x.prebuy === true || x.prebuy === "true",
      no_discount: x.no_discount === true || x.no_discount === "true",
      is_new: x.is_new === true || x.is_new === "true",
    });
  });
  return out.length ? out : null;
}

/* ---- Stack component resolution: sku_code first, name only as a legacy fallback.
   components[] holds NAME STRINGS, which is a join the pipeline forbids: the string
   "CJC-1295 + Ipamorelin 10mg" never matched the DB name
   "CJC-1295 + Ipamorelin 10mg (5mg + 5mg)", so the component silently priced at 0,
   the Full Recovery Stack advertised no saving, and its stock ignored CJC entirely. */
function stackRefs(p) {
  return (p.component_skus && p.component_skus.length) ? p.component_skus : (p.components || []);
}
function resolveRef(products, ref) {
  const list = products || [];
  return list.find((q) => q.sku_code === ref) || list.find((q) => q.name === ref) || null;
}

/* ================================== APP ==================================== */
function App() {
  const [stage, setStage] = useState("shop");       // shop | checkout | done
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [stage]);  // review/checkout opens at the top, not mid-cart
  const [cart, setCart] = useState({});             // { productId: qty }
  const [q, setQ] = useState("");

  const [me, setMe] = useState(() => loadMe());
  const [name, setName] = useState(me?.name || "");
  const [email, setEmail] = useState(me?.email || "");
  const [phone, setPhone] = useState(me?.phone || "");
  const [fulfil, setFulfil] = useState("pickup");   // pickup | shipping | delivery
  const [pickDate, setPickDate] = useState("");        // required for pickup
  const [pickupType, setPickupType] = useState(""); // "" (unchosen) | contactless | consult
  const [address, setAddress] = useState(me?.address || "");
  const [payment, setPayment] = useState("etransfer"); // etransfer | cash
  const [reconQty, setReconQty] = useState(0);         // vials to reconstitute (chosen on the shop screen)
  const [notes, setNotes] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [placed, setPlaced] = useState(null);       // finalized order for confirmation
  const [stock, setStock] = useState(null);         // { p01: {onHand, reserved, available, inbound} } | null while loading
  const [products, setProducts] = useState(null);   // null = not loaded yet. NEVER a typed list.
  const [catalogFailed, setCatalogFailed] = useState(false);
  const [prefill, setPrefill] = useState(null);     // { added, missed, from } when arriving from a ?cart= link

  /* ---- ARRIVING WITH A CART ------------------------------------------------
     Ask Tara and the Protocol Builder work out exactly which vials a cycle needs,
     then link here as  ?cart=TJ-RETA-40:1,TJ-RETA-30:1&from=builder
     We fill the basket so nobody has to re-pick it by hand and get it wrong —
     but it is an ORDINARY cart from that moment on: change quantities, remove
     things, add extras, and enter your own details at checkout. No account, no
     login, nothing locked. Runs once, after the catalogue has loaded, because
     the cart is keyed by product id and only the catalogue knows the mapping. */
  useEffect(() => {
    if (!products || prefill) return;
    let raw = "", from = "";
    try {
      const sp = new URLSearchParams(window.location.search);
      raw = sp.get("cart") || ""; from = (sp.get("from") || "").toLowerCase();
    } catch (e) { return; }
    if (!raw) return;
    const bySku = {};
    products.forEach((p) => { if (p.sku_code) bySku[String(p.sku_code).toUpperCase()] = p; });
    const next = {}; let added = 0; const missed = [];
    raw.split(",").forEach((part) => {
      const bits = String(part).trim().split(":");
      const sku = (bits[0] || "").trim().toUpperCase();
      let qty = parseInt(bits[1], 10); if (!Number.isFinite(qty) || qty < 1) qty = 1;
      qty = Math.min(qty, 99);
      if (!sku) return;
      const prod = bySku[sku];
      if (!prod) { missed.push(sku); return; }
      next[prod.id] = (next[prod.id] || 0) + qty;
      added += qty;
    });
    if (added > 0) setCart((c) => ({ ...c, ...next }));
    setPrefill({ added: added, missed: missed, from: from });
    // drop the query string so a refresh does not stack the same items again
    try { window.history.replaceState({}, "", window.location.pathname); } catch (e) {}
  }, [products, prefill]);

  /* ---- ?product=SKU deep link ----------------------------------------------
     The banner links to shop?product=TJ-GLOWTOX-50. Without this the visitor lands
     at the top of a long catalogue and has to hunt for it, which is exactly the
     complaint. Waits for the catalogue to render, scrolls the matching card into
     view and rings it briefly so the eye lands on the right thing. Falls through
     silently if the SKU is unknown or hidden — a bad link must never be an error. */
  useEffect(() => {
    if (!products || !products.length) return;
    let sku = "";
    try { sku = (new URLSearchParams(window.location.search).get("product") || "").trim().toUpperCase(); } catch (e) { return; }
    if (!sku) return;
    const t = setTimeout(() => {
      const card = [...document.querySelectorAll("[data-skus]")]
        .find((el) => (el.getAttribute("data-skus") || "").toUpperCase().split(",").includes(sku));
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      const prev = card.style.boxShadow;
      card.style.transition = "box-shadow .4s";
      card.style.boxShadow = `0 0 0 2px ${C.teal}, 0 0 26px ${C.teal}55`;
      setTimeout(() => { card.style.boxShadow = prev || "none"; }, 2600);
      try { window.history.replaceState({}, "", window.location.pathname); } catch (e) {}
    }, 350);
    return () => clearTimeout(t);
  }, [products]);

  // Load live inventory, open orders, and inbound POs, then build the per-product stock map.
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const [inv, orders, pos, prd, pricing] = await Promise.all([
          store.getShopInventory(), store.getShopOrders(), store.getShopInbound(), store.getShopProducts(),
          store.get("tj_pricing_v1"),
        ]);
        if (!alive) return;
        applyPricing(pricing); // live ladder + fees before anything is priced
        const merged = catalogFrom(prd);
        if (!merged) { setCatalogFailed(true); return; }  // silence, not a stale figure
        setProducts(merged);
        setStock(buildStockMap(inv || [], orders || [], pos || [], merged));
      } catch (e) {
        // A wrong number is worse than no number. Fail closed, never to a price.
        if (alive) setCatalogFailed(true);
      }
    })();
    return () => { alive = false; };
  }, []);

  const pmap = useMemo(() => Object.fromEntries((products || []).map((p) => [p.id, p])), [products]);
  const items = useMemo(() => Object.entries(cart).filter(([, n]) => n > 0)
    .map(([id, qty]) => ({ ...pmap[id], qty })), [cart, pmap]);
  const subtotal = useMemo(() => items.reduce((s, it) => s + it.price * it.qty, 0), [items]);
  const disc = discountFor(subtotal);
  const deliveryFee = fulfil === "shipping" ? SHIP_FEE : fulfil === "delivery" ? DELIVERY_FEE : 0;
  const vialsPerItem = (it) => (it.isKit && Array.isArray(it.components)) ? it.components.length
    : ((it.category !== "Supplies") && /vial/i.test(it.unit || "")) ? 1
    : 0;  // shop items have `unit`/`category`, not `form` — count peptide vials + stack vials, exclude supplies/nasal
  const vialCount = items.reduce((n, it) => n + (Number(it.qty) || 0) * vialsPerItem(it), 0);
  const reconVialsChosen = vialCount > 0 ? Math.max(0, Math.min(reconQty, vialCount)) : 0;
  const reconFee = reconVialsChosen * RECON_PER_VIAL;
  const recon = reconVialsChosen > 0;
  useEffect(() => { if (recon && fulfil === "shipping") setFulfil("pickup"); }, [recon]); // reconstituted orders can't ship
  const goods = subtotal + reconFee;
  // ---- Full-price lines -----------------------------------------------------
  // A product flagged no_discount is sold at list: no volume tier, no cash 5%.
  // It STILL counts toward the subtotal that qualifies the basket for a tier, so
  // the rest of the cart is unaffected — it simply is not discounted itself.
  // Must mirror orderCalc() in the Tracker exactly, or the Shop and the order book
  // will disagree about what the customer owes.
  const noDiscTotal = +items.filter((it) => it.no_discount)
    .reduce((a, it) => a + (Number(it.price) || 0) * (Number(it.qty) || 0), 0).toFixed(2);
  const discountable = Math.max(0, +(goods - noDiscTotal).toFixed(2));
  const discAmt = disc ? +(discountable * disc.pct / 100).toFixed(2) : 0;
  const cashAmt = payment === "cash" ? +((discountable * CASH_PCT) / 100).toFixed(2) : 0;
  const rawTotal = +(goods - discAmt - cashAmt + deliveryFee).toFixed(2);
  const total = payment === "cash" ? Math.floor(rawTotal) : rawTotal;
  const roundAdj = payment === "cash" ? +(rawTotal - total).toFixed(2) : 0;
  const cartCount = items.reduce((s, it) => s + it.qty, 0);

  const setQty = (id, qty) => setCart((c) => ({ ...c, [id]: Math.max(0, qty) }));

  const contactOk = name.trim() && (email.trim() || phone.trim());
  const addressOk = fulfil === "pickup" || address.trim();
  const pickupOk = fulfil !== "pickup" || (pickDate && pickupType);
  const canPlace = items.length > 0 && contactOk && addressOk && pickupOk && !submitting;

  async function placeOrder() {
    if (!canPlace) return;
    setSubmitting(true);
    /* ===== T&J BACKEND — DO NOT EDIT OR DELETE · order numbers shared with the Tracker (never revert to Date.now) ===== */
    // The order number is assigned by tj_shop_place_order() in the same statement that
    // queues the order, so two people checking out at once can no longer be handed the
    // same number — and this page never reads the order book to work it out.
    let orderNum = null;
    /* ===== END T&J BACKEND ===== */
    const order = {
      date: todayISO(),
      customer: { name: name.trim(), email: email.trim(), phone: phone.trim() },
      fulfil, address: fulfil === "pickup" ? "" : address.trim(),
      payment, pickDate: fulfil === "pickup" ? pickDate : "",
      pickupType: fulfil === "pickup" ? pickupType : "",
      notes: [
        notes.trim(),
        fulfil === "shipping" ? `Shipping (+${money(SHIP_FEE)})` : fulfil === "delivery" ? `Delivery (+${money(DELIVERY_FEE)})` : `Pickup ${pickDate || "TBD"} · ${pickupType === "consult" ? "consult (booking via Calendly)" : "contactless"}`,
        recon ? `Reconstitution ${reconVialsChosen}×$${RECON_PER_VIAL} (+${money(reconFee)})` : "",
      ].filter(Boolean).join(" · "),
      items: items.map((it) => ({ id: it.id, name: it.name, unit: it.unit, qty: it.qty, price: it.price })),
      sub: subtotal, disc: discAmt, cashDisc: cashAmt, total, fullPrice: noDiscTotal,
      discount: disc ? { pct: disc.pct, label: disc.label } : null,
      cashDiscount: cashAmt > 0 ? { pct: CASH_PCT, amount: cashAmt } : null,
      deliveryFee,
      recon,
      reconFee,
      reconVials: reconVialsChosen,
      shopVersion: SHOP_VERSION,
    };
    try {
      // 1) queue into the tracker's pending list — server-side, one statement,
      //    and it hands back the order number it assigned.
      orderNum = await store.placeOrder(order);
      order.orderNum = orderNum;
      // 2) email notification (best-effort)
      const summary = order.items.map((it) => `${it.name} x${it.qty} — ${money(it.price * it.qty)}`).join("\n");
      const msg = `Order #${orderNum}\n${order.customer.name}\n${order.customer.email || ""} ${order.customer.phone || ""}\n\n${summary}\n\nSubtotal ${money(subtotal)}${disc ? `\nDiscount (${disc.label}) -${money(discAmt)}` : ""}${deliveryFee ? `\n${fulfil === "shipping" ? "Shipping" : "Delivery"} ${money(deliveryFee)}` : ""}${reconFee ? `\nReconstitution ${money(reconFee)}` : ""}${cashAmt ? `\nCash discount (${CASH_PCT}%) -${money(cashAmt)}` : ""}${roundAdj ? `\nRounded down -${money(roundAdj)}` : ""}\nTotal ${money(total)}\n\nFulfillment: ${fulfil === "shipping" ? `Shipping → ${order.address}` : fulfil === "delivery" ? `Delivery → ${order.address}` : `Pickup ${pickDate || "TBD"} (${pickupType})`}\nPayment: ${payment === "etransfer" ? "E-Transfer" : "Cash"}${order.notes ? `\nNotes: ${order.notes}` : ""}`;
      /* ===== T&J BACKEND — DO NOT EDIT OR DELETE · order email via Resend, keeps you out of junk (never revert to web3forms) ·
         retries up to 4x with keepalive so a Netlify cold start (~2s) or a transient Resend blip can't silently drop your owner notification ===== */
      (async () => {
        const _emailBody = JSON.stringify({ subject: `New T&J Order #${orderNum}`, message: msg, orderNum, customerEmail: order.customer.email || "", customerName: order.customer.name || "" });
        for (let _a = 1; _a <= 4; _a++) {
          try {
            const _r = await fetch("https://app.tjwellnesscircle.ca/.netlify/functions/send-order-email", {
              method: "POST", headers: { "Content-Type": "application/json" }, body: _emailBody, keepalive: true,
            });
            if (_r.ok) return;
          } catch (e) {}
          await new Promise((res) => setTimeout(res, 1200 * _a));
        }
      })();
      /* ===== END T&J BACKEND ===== */
    } catch (e) {
      console.error("Order submit error", e);
    }
    // remember this buyer on this device + keep their history
    saveMe({ name: name.trim(), email: email.trim(), phone: phone.trim(), address: address.trim() });
    saveHist([{ orderNum, date: order.date, total, items: order.items }, ...loadHist()]);
    setPlaced(order);
    setSubmitting(false);
    setStage("done");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function reset() {
    setCart({}); setNotes(""); setPlaced(null); setStage("shop");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Clear the customer saved on THIS device (used on your own device between orders,
  // or by anyone on a shared device who isn't the saved person).
  function forgetMe() {
    try { localStorage.removeItem(ME_KEY); } catch {}
    setMe(null);
    setName(""); setEmail(""); setPhone(""); setAddress("");
    setStage("shop");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: FONT }}>
      <style>{`
        html { -webkit-text-size-adjust: 100%; }
        input::placeholder, textarea::placeholder { color: ${C.textDim}; opacity: .8; }
        input:focus, textarea:focus { border-color: ${C.teal} !important; }
        /* 16px keeps iOS Safari from auto-zooming when a field is focused */
        input, textarea, select { font-size: 16px; }
        button { touch-action: manipulation; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        @keyframes tjpop { from { transform: scale(.96); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      `}</style>

      {/* Header */}
      <header style={{ position: "sticky", top: 0, zIndex: 20, background: `${C.bg}f2`, backdropFilter: "blur(8px)", borderBottom: `1px solid ${C.lineSoft}` }}>
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "13px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Mark />
            <div>
              <div style={{ fontFamily: SERIF, fontWeight: 800, fontSize: 17, lineHeight: 1 }}>T&amp;J Wellness Circle</div>
              <div style={{ fontFamily: MONO, fontSize: 9.5, color: C.teal, letterSpacing: "0.22em", marginTop: 4 }}>MEMBER SHOP</div>
            </div>
          </div>
          {stage === "shop" && cartCount > 0 && (
            <button onClick={() => setStage("checkout")} aria-label={`Review order, ${cartCount} items, ${money(total)}`}
              style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0, background: C.teal, color: "#04140d", border: "none", borderRadius: 999, padding: "8px 14px", fontFamily: FONT, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#04140d" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></svg>
              <span style={{ fontFamily: MONO }}>{cartCount} · {money(total)}</span>
            </button>
          )}
          {stage !== "shop" && stage !== "done" && (
            <Btn variant="ghost" size="sm" onClick={() => setStage("shop")}>← Keep shopping</Btn>
          )}
        </div>
      </header>

      <TopBanner />

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "18px 16px 120px" }}>
        {prefill && prefill.added > 0 && (
          <div style={{ border: "1px solid #cfe0d5", background: "#f1f7f3", borderRadius: 12,
                        padding: "13px 15px", marginBottom: 14 }}>
            <div style={{ fontWeight: 700, color: "#173229", fontSize: 15 }}>
              {prefill.from === "tara" ? "Tara put your cycle in the basket" : "Your protocol is in the basket"}
            </div>
            <div style={{ fontSize: 13.5, color: "#4a5b51", marginTop: 3, lineHeight: 1.5 }}>
              {prefill.added} item{prefill.added === 1 ? "" : "s"} added — everything the cycle you planned needs.
              Change anything you like before you check out, and add your details at the end as usual.
              {prefill.missed && prefill.missed.length > 0 && (
                <span style={{ display: "block", marginTop: 5, color: "#9a6a2a" }}>
                  {prefill.missed.length} item{prefill.missed.length === 1 ? "" : "s"} from that plan
                  {prefill.missed.length === 1 ? " is" : " are"} not currently on the shop — have a look below or ask us.
                </span>
              )}
            </div>
            <button type="button" onClick={() => { setCart({}); setPrefill(null); }}
              style={{ marginTop: 9, background: "transparent", border: "1px solid #cfe0d5",
                       borderRadius: 20, padding: "5px 12px", fontSize: 12.5, color: "#4a5b51", cursor: "pointer" }}>
              Start with an empty basket instead
            </button>
          </div>
        )}
        {catalogFailed && <CatalogUnavailable />}
        {!catalogFailed && products === null && <CatalogSkeleton />}
        {products !== null && stage === "shop" && (
          <ShopScreen products={products} cart={cart} setQty={setQty} q={q} setQ={setQ} me={me} onForget={forgetMe} stock={stock} vialCount={vialCount} reconPerVial={RECON_PER_VIAL} reconQty={reconQty} setReconQty={setReconQty} reconVialsChosen={reconVialsChosen} reconFee={reconFee} />
        )}
        {products !== null && stage === "checkout" && (
          <CheckoutScreen products={products}
            items={items} subtotal={subtotal} disc={disc} discAmt={discAmt} cashAmt={cashAmt} roundAdj={roundAdj} noDiscTotal={noDiscTotal}
            deliveryFee={deliveryFee} total={total} setQty={setQty}
            name={name} setName={setName} email={email} setEmail={setEmail} phone={phone} setPhone={setPhone}
            fulfil={fulfil} setFulfil={setFulfil} address={address} setAddress={setAddress}
            pickDate={pickDate} setPickDate={setPickDate} pickupType={pickupType} setPickupType={setPickupType}
            payment={payment} setPayment={setPayment} notes={notes} setNotes={setNotes}
            recon={recon} reconFee={reconFee} vialCount={vialCount} reconPerVial={RECON_PER_VIAL} reconVialsChosen={reconVialsChosen} reconQty={reconQty} setReconQty={setReconQty}
            contactOk={contactOk} addressOk={addressOk} canPlace={canPlace} submitting={submitting}
            me={me} onForget={forgetMe}
            placeOrder={placeOrder} backToShop={() => setStage("shop")}
          />
        )}
        {stage === "done" && placed && <DoneScreen order={placed} reset={reset} />}

        <footer style={{ textAlign: "center", padding: "28px 16px 4px", color: C.textDim, fontFamily: MONO, fontSize: 10, letterSpacing: "0.14em" }}>
          T&amp;J WELLNESS CIRCLE · SHOP v{SHOP_VERSION}
        </footer>
      </main>

      {/* Sticky cart bar (mobile-friendly) */}
      {stage === "shop" && cartCount > 0 && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 30, background: C.bg2, borderTop: `1px solid ${C.line}`, padding: "12px 16px", paddingBottom: "calc(12px + env(safe-area-inset-bottom))", boxShadow: "0 -8px 24px #0006" }}>
        <div id="tj-cartbar" style={{ maxWidth: 720, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <div>
              <div style={{ fontFamily: MONO, fontSize: 11, color: C.textDim }}>{cartCount} {cartCount === 1 ? "item" : "items"}{disc ? ` · ${disc.pct}% off applied` : ""}</div>
              <div style={{ fontWeight: 700, fontSize: 20, fontFamily: MONO, color: C.teal }}>{money(total)}</div>
            </div>
            <Btn size="lg" onClick={() => setStage("checkout")}>Review order →</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------- SHOP SCREEN ------------------------------- */
/* ---- Loading + failure states -------------------------------------------
   The rule: a number must never appear before it is true. Empty -> real value.
   Never wrong -> right. So while the catalog is in flight we show shaped grey
   boxes containing NO digits, and if it never arrives we say so plainly rather
   than showing a figure we cannot stand behind. Silence is honest. A stale
   price is not. ----------------------------------------------------------- */
function CatalogSkeleton() {
  const bar = (w, h) => ({ width: w, height: h, borderRadius: 6, background: C.line, opacity: 0.55 });
  return (
    <div aria-busy="true" aria-label="Loading catalog">
      <div style={{ ...bar("46%", 15), marginBottom: 18 }} />
      {[0, 1, 2, 3, 4, 5].map((i) => (
        <div key={i} style={{ display: "flex", gap: 12, alignItems: "center",
                              padding: "14px 0", borderBottom: "1px solid " + C.line }}>
          <div style={{ ...bar(46, 46), borderRadius: 10, flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <div style={{ ...bar((58 + ((i * 13) % 26)) + "%", 13), marginBottom: 8 }} />
            <div style={{ ...bar((34 + ((i * 7) % 18)) + "%", 10) }} />
          </div>
          <div style={{ ...bar(52, 15), flexShrink: 0 }} />
        </div>
      ))}
    </div>
  );
}
function CatalogUnavailable() {
  return (
    <div style={{ textAlign: "center", padding: "56px 20px" }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: C.text, marginBottom: 8 }}>
        Catalog unavailable
      </div>
      <div style={{ fontSize: 13.5, color: C.textDim, lineHeight: 1.6, maxWidth: 350, margin: "0 auto 20px" }}>
        We could not reach our price list, so we are not showing one — any price here
        would be a guess. Please try again in a moment.
      </div>
      <Btn onClick={() => window.location.reload()}>Retry</Btn>
      <div style={{ fontSize: 12, color: C.textDim, marginTop: 22 }}>
        Need something now? Text {PHONE}.
      </div>
    </div>
  );
}

function ShopScreen({ products, cart, setQty, q, setQ, me, onForget, stock, vialCount, reconPerVial, reconQty, setReconQty, reconVialsChosen, reconFee }) {
  const [catFilter, setCatFilter] = useState("all");
  const shopSubtotal = products.reduce((a, p) => a + (cart[p.id] || 0) * (p.price || 0), 0);
  const filtered = products.filter((p) => !q || (p.name + " " + p.desc).toLowerCase().includes(q.toLowerCase()));
  const present = SHOP_CATS.filter((c) => c !== "Supplies" && filtered.some((p) => categoryOf(p) === c));  // supplies (needles + BAC water) live only at checkout now
  const shown = catFilter === "all" || !present.includes(catFilter) ? present : [catFilter];
  return (
    <div>
      {me?.name && (
        <div style={{ background: C.surface, border: `1px solid ${C.tealDim}`, borderRadius: 12, padding: "11px 14px", marginBottom: 14, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <span>Welcome back, <b>{me.name.split(" ")[0]}</b>. Details are saved on this device.</span>
          <button onClick={onForget} style={{ flexShrink: 0, background: "transparent", border: `1px solid ${C.line}`, color: C.teal, borderRadius: 8, padding: "6px 12px", fontFamily: FONT, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Not you? New customer</button>
        </div>
      )}
      <Hero />
      <div style={{ display: "flex", alignItems: "center", gap: 11, background: "linear-gradient(135deg,#0f3b26,#14776a)", border: `1px solid ${C.teal}`, borderRadius: 14, padding: "12px 15px", marginBottom: 14, boxShadow: "0 4px 16px rgba(20,119,106,.25)" }}>
        <span style={{ fontSize: 22, lineHeight: 1 }} aria-hidden="true">💵</span>
        <div style={{ fontSize: 14, fontWeight: 700, color: "#eafaf3" }}>Instant 5% off when you pay cash <span style={{ fontWeight: 500, color: "rgba(234,250,243,.82)" }}>— just choose “Cash” at checkout.</span></div>
      </div>
      {vialCount > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, background: reconVialsChosen > 0 ? "rgba(20,119,106,.14)" : C.surface, border: `1px solid ${reconVialsChosen > 0 ? C.teal : C.line}`, borderRadius: 14, padding: "12px 15px", marginBottom: 14 }}>
          <span style={{ fontSize: 22, lineHeight: 1 }} aria-hidden="true">🧪</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>Need reconstitution? <span style={{ color: C.teal }}>${reconPerVial}/vial</span></div>
            <div style={{ fontSize: 12.5, color: C.textDim, lineHeight: 1.4 }}>We mix your vials so they're ready to use — no BAC water needed. Choose how many of your {vialCount} {vialCount === 1 ? "vial" : "vials"} to reconstitute.{reconVialsChosen > 0 ? ` ${reconVialsChosen} × $${reconPerVial} = ${money(reconFee)}.` : ""} Pickup/delivery only.</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
            <button type="button" aria-label="Fewer vials" onClick={() => setReconQty(Math.max(0, reconVialsChosen - 1))} style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${C.line}`, background: C.bg, color: C.text, fontSize: 19, cursor: "pointer", lineHeight: 1 }}>−</button>
            <span style={{ fontFamily: MONO, fontWeight: 700, fontSize: 16, minWidth: 20, textAlign: "center", color: reconVialsChosen > 0 ? C.teal : C.textDim }}>{reconVialsChosen}</span>
            <button type="button" aria-label="More vials" onClick={() => setReconQty(Math.min(vialCount, reconVialsChosen + 1))} style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${C.line}`, background: C.bg, color: C.text, fontSize: 19, cursor: "pointer", lineHeight: 1 }}>+</button>
          </div>
        </div>
      )}
      <SaveBar subtotal={shopSubtotal} />
      <div style={{ display: "flex", gap: 9, alignItems: "flex-start", background: C.surface, border: `1px solid ${C.tealDim}`, borderRadius: 12, padding: "11px 13px", marginBottom: 16, fontSize: 12.5, lineHeight: 1.5, color: C.text }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.teal} strokeWidth="2" style={{ flexShrink: 0, marginTop: 1 }}><path d="M12 2 4 6v6c0 5 3.4 8 8 10 4.6-2 8-5 8-10V6z" /></svg>
        <div><b>Comparing prices?</b> Check the vial size first — ours are often larger. Find the same size cheaper and we'll match it.</div>
      </div>
      <Input value={q} onChange={setQ} placeholder="Search products…" style={{ marginBottom: 16 }} />

      {present.length > 1 && (
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 6, marginBottom: 16, WebkitOverflowScrolling: "touch" }}>
          {["all", ...present].map((c) => {
            const on = catFilter === c || (c === "all" && (catFilter === "all" || !present.includes(catFilter)));
            return (
              <button key={c} onClick={() => setCatFilter(c)} style={{ display: "flex", alignItems: "center", gap: 7, flexShrink: 0, padding: "8px 13px", borderRadius: 999, fontFamily: FONT, fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", border: `1px solid ${on ? "transparent" : C.line}`, background: on ? (c === "all" ? C.teal : catMeta(c).cc) : C.surface, color: on ? "#03110c" : C.textDim }}>{c !== "all" && <span style={{ width: 8, height: 8, borderRadius: "50%", background: on ? "#03110c" : catMeta(c).cc }} />}{c === "all" ? "All" : catLabel(c)}</button>
            );
          })}
        </div>
      )}

      {shown.map((cat) => {
        const list = filtered.filter((p) => categoryOf(p) === cat).slice().sort(byNameThenSize);
        if (!list.length) return null;
        return (
          <section key={cat} style={{ marginBottom: 22 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 11, marginBottom: 12 }}>
              <div style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, display: "grid", placeItems: "center", background: catMeta(cat).cb }}><CatIcon cat={cat} size={19} /></div>
              <div style={{ fontFamily: MONO, fontSize: 11.5, letterSpacing: "0.14em", textTransform: "uppercase", color: catMeta(cat).cc, fontWeight: 500 }}>{cat}</div>
              <div style={{ flex: 1, height: 1, background: C.lineSoft }} />
            </div>
            <div style={{ display: "grid", gap: 11 }}>
              {cat === "Supplies"
                ? list.map((p) => <ProductRow key={p.id} p={p} qty={cart[p.id] || 0} setQty={setQty} st={stock ? stock[p.id] : undefined} loading={stock === null} />)
                : cat === "Stacks & Bundles"
                ? list.map((p) => <StackCard key={p.id} p={p} qty={cart[p.id] || 0} setQty={setQty} st={stock ? stock[p.id] : undefined} loading={stock === null} products={products} />)
                : groupByCompound(list).map((grp) => <CompoundCard key={grp.key} grp={grp} cart={cart} setQty={setQty} stock={stock} />)}
            </div>
          </section>
        );
      })}
      {filtered.length === 0 && (
        <div style={{ color: C.textDim, textAlign: "center", padding: "40px 0" }}>No products match “{q}”.</div>
      )}
      <div style={{ marginTop: 10, background: C.surface, border: `1px dashed ${C.tealDim}`, borderRadius: 12, padding: "13px 15px", display: "flex", alignItems: "center", gap: 10, fontSize: 13, color: C.textDim, lineHeight: 1.4 }}>
        <span style={{ fontSize: 18, flexShrink: 0 }}>💧</span>
        <span>Need <b style={{ color: C.text }}>needles</b>, <b style={{ color: C.text }}>BAC water</b>, or <b style={{ color: C.text }}>reconstitution</b>? You'll add those at checkout — no need to hunt for them here.</span>
      </div>
    </div>
  );
}

/* group a category's SKUs into one card per compound (sizes ordered smallest→largest) */
function groupByCompound(list) {
  const map = new Map();
  list.forEach((p) => {
    const base = compoundName(p);
    if (!map.has(base)) map.set(base, []);
    map.get(base).push(p);
  });
  return [...map.entries()].map(([base, skus]) => ({
    key: base, base,
    skus: skus.slice().sort((a, b) => { const [ax, ay] = sizeKey(a.name), [bx, by] = sizeKey(b.name); return ax - bx || ay - by; }),
  }));
}

/* ---- Top banner ------------------------------------------------------------
   Renders store.tj_banner_v1, which the Digital executive owns and edits. Their
   copy, my rendering. It was already enabled with GlowTox copy but nothing showed,
   because the Shop only ever had a <script src> to banner.js on the Hub domain and
   no mount point of its own. Reading the record directly removes that dependency:
   anything they change appears here within a page load, no deploy from either side.
   Honours enabled, show_from / show_until (yyyy-mm-dd, inclusive), tone and
   dismissible. link_url may deep-link with ?product=SKU, handled below.
   ---------------------------------------------------------------------------- */
const BANNER_TONE = { notice: "#3cba7d", warn: "#f5c96a", sale: "#e8b64c" };

function TopBanner() {
  const [b, setB] = useState(null);
  const [gone, setGone] = useState(false);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const v = await store.get("tj_banner_v1");
        if (!alive || !v || v.enabled !== true) return;
        const today = new Date().toISOString().slice(0, 10);
        if (v.show_from && today < v.show_from) return;      // inclusive
        if (v.show_until && today > v.show_until) return;    // inclusive
        setB(v);
      } catch (e) { /* a banner is never worth breaking the shop for */ }
    })();
    return () => { alive = false; };
  }, []);
  const key = b ? "tj_banner_seen_" + encodeURIComponent((b.headline || "") + "|" + (b.show_from || "")) : "";
  useEffect(() => { if (b && b.dismissible) { try { if (localStorage.getItem(key)) setGone(true); } catch (e) {} } }, [b, key]);
  if (!b || gone) return null;
  const cc = BANNER_TONE[b.tone] || BANNER_TONE.notice;
  const dismiss = () => { setGone(true); try { localStorage.setItem(key, "1"); } catch (e) {} };
  return (
    <div style={{ background: `linear-gradient(180deg, ${cc}1f, ${cc}0d)`, borderBottom: `1px solid ${cc}55` }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "13px 16px", display: "flex", alignItems: "flex-start", gap: 12 }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          {b.headline && (
            <div style={{ fontFamily: SERIF, fontWeight: 700, fontSize: 17, lineHeight: 1.2, color: C.text }}>
              {b.headline}
            </div>
          )}
          {b.body && (
            <div style={{ color: C.textDim, fontSize: 13, lineHeight: 1.5, marginTop: 5 }}>{b.body}</div>
          )}
          {b.link_url && (
            <a href={b.link_url}
               style={{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 10,
                        background: cc, color: "#0a1610", textDecoration: "none",
                        borderRadius: 999, padding: "9px 16px", minHeight: 40,
                        fontFamily: FONT, fontWeight: 700, fontSize: 13.5 }}>
              {b.link_text || "See it"} <span aria-hidden>{"\u2192"}</span>
            </a>
          )}
        </div>
        {b.dismissible && (
          <button onClick={dismiss} aria-label="Dismiss"
            style={{ background: "transparent", border: "none", color: C.textDim, cursor: "pointer",
                     fontSize: 20, lineHeight: 1, padding: "2px 4px", flexShrink: 0, minHeight: 32 }}>{"\u00d7"}</button>
        )}
      </div>
    </div>
  );
}

          @media(max-width:520px){#tjtara-panel{right:8px;left:8px;bottom:8px;width:auto;max-width:none;height:82vh;border-radius:20px;}#tjtara-fab{padding:12px 16px 12px 13px;font-size:14px;}}";
        document.head.appendChild(css);

        var SPARK = '<svg class="tjt-spark" viewBox="0 0 24 24" fill="#eafff3"><path d="M12 2l1.9 5.6L19.5 9l-4.3 3.2L16.7 18 12 14.7 7.3 18l1.5-5.8L4.5 9l5.6-1.4z"/></svg>';
        var SPARK2 = '<svg viewBox="0 0 24 24" fill="#0d1f14"><path d="M12 2l1.9 5.6L19.5 9l-4.3 3.2L16.7 18 12 14.7 7.3 18l1.5-5.8L4.5 9l5.6-1.4z"/></svg>';

        var fab = document.createElement("button");
        fab.id = "tjtara-fab";
        fab.setAttribute("aria-label", "Ask Tara — your peptide guide");
        fab.innerHTML = '<span class="tjt-ring"></span>' + SPARK + '<span>Ask Tara</span>';
        document.body.appendChild(fab);

        var ov = document.createElement("div"); ov.id = "tjtara-ov"; document.body.appendChild(ov);
        var panel = document.createElement("div"); panel.id = "tjtara-panel";
        panel.innerHTML =
          '<div class="tjt-head"><div class="tjt-av">' + SPARK2 + '</div>' +
          '<div class="tjt-htxt"><div class="tjt-name">Tara</div><div class="tjt-sub"><span class="tjt-dotlive"></span>Your peptide guide</div></div>' +
          '<button class="tjt-x" aria-label="Close">\u2715</button></div>' +
          '<div class="tjt-msgs" id="tjt-msgs"></div>' +
          '<div class="tjt-foot"><div class="tjt-pills" id="tjt-pills"></div>' +
          '<div class="tjt-inrow"><textarea class="tjt-in" id="tjt-in" rows="1" placeholder="Tell me your goal\u2026"></textarea>' +
          '<button class="tjt-send" id="tjt-send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg></button></div>' +
          '<div class="tjt-disc">Educational only · not medical advice · always consult a physician</div></div>';
        document.body.appendChild(panel);

        var msgs = panel.querySelector("#tjt-msgs");
        var input = panel.querySelector("#tjt-in");
        var send = panel.querySelector("#tjt-send");
        var pillWrap = panel.querySelector("#tjt-pills");

        function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
        function fmt(t){t=esc(t);t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");t=t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noreferrer">$1</a>');return t.replace(/\n/g,"<br>");}
        function bubble(txt, role, raw){var d=document.createElement("div");d.className="tjt-b "+role;d.innerHTML=raw?txt:fmt(txt);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}

        var greeted = false;
        var QUICKS = ["Lose weight","Recovery & joints","Perimenopause","Energy & focus","TRT support","How do I mix & dose?"];
        var QMAP = {"Lose weight":"I want to lose weight","Recovery & joints":"I have joint pain and need to recover from injuries","Perimenopause":"I'm a woman going through perimenopause","Energy & focus":"I need more energy and mental focus","TRT support":"I'm on TRT and want support","How do I mix & dose?":"How do I reconstitute and dose my peptides?"};
        function renderPills(){pillWrap.innerHTML="";QUICKS.forEach(function(q){var b=document.createElement("button");b.className="tjt-pill";b.textContent=q;b.onclick=function(){input.value=QMAP[q]||q;submit();};pillWrap.appendChild(b);});}

        function open(){
          ov.classList.add("open"); panel.classList.add("open"); opened=true;
          if(!greeted){greeted=true;bubble("Hey! I'm <strong>Tara</strong> \uD83D\uDC9A I help you match peptides to your goals \u2014 and I'll walk you through exactly how to mix and dose them.<br><br>What's going on with you? The more real you are, the better I can help.","ai",true);renderPills();}
          setTimeout(function(){input.focus();},250);
        }
        function close(){ov.classList.remove("open");panel.classList.remove("open");opened=false;}
        fab.onclick=function(){opened?close():open();};
        ov.onclick=close;
        panel.querySelector(".tjt-x").onclick=close;
        input.addEventListener("input",function(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,96)+"px";});
        input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}});
        send.onclick=submit;

        async function submit(){
          if(busy)return;var text=input.value.trim();if(!text)return;
          pillWrap.style.display="none";
          input.value="";input.style.height="auto";
          busy=true;send.disabled=true;
          bubble(text,"me");history.push({role:"user",content:text});
          var typing=bubble("Tara is thinking\u2026","typing",true);
          var live=null;
          try{
            var reply=await streamAsk(history,function(partial){
              if(!live){ typing.remove(); live=bubble(partial,"ai"); }
              else { live.innerHTML=fmt(partial); }
              msgs.scrollTop=msgs.scrollHeight;
            });
            if(!live){ typing.remove(); live=bubble(reply,"ai"); }
            history.push({role:"assistant",content:reply});
          }catch(streamErr){
            try{
              var res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
              var data=await res.json();
              if(live){ live.remove(); live=null; }
              typing.remove();
              if(data.reply){bubble(data.reply,"ai");history.push({role:"assistant",content:data.reply});}
              else{bubble((data.error||"I had a little trouble just now \u2014 try me again in a moment, or book a free consult: "+CONSULT),"ai");}
            }catch(e){
              if(live){ live.remove(); }
              typing.remove();
              bubble("Sorry, I couldn't connect right now. Give me a moment and try again \u2014 or book a free consult: "+CONSULT,"ai");
            }
          }
          busy=false;send.disabled=false;input.focus();
          if(window.__tjtShare) window.__tjtShare();
        }

        /* ---- Copy / Text / Email the conversation ---------------------------
           Same three actions as the Hub. `sms:` and `mailto:` hand the text to
           the phone's own Messages / Mail app with the body prefilled, so the
           customer picks the recipient there — no typing a number into a form.
           Copy is primary: it is the only one an OS URL-length limit cannot
           truncate. -------------------------------------------------------- */
        function transcript(){
          var out=[];
          msgs.querySelectorAll(".tjt-b").forEach(function(b){
            if(b.classList.contains("typing")) return;
            var who=b.classList.contains("me")?"Me":"Tara";
            var t=(b.innerText||"").trim();
            if(t) out.push(who+": "+t);
          });
          if(!out.length) return "";
          return "Ask Tara — T&J Peptides\n"+new Date().toLocaleString()+"\n\n"+out.join("\n\n")
            +"\n\n— Educational only, not medical advice. shop.tjwellnesscircle.ca";
        }
        var SI={copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
                text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5A8.4 8.4 0 0 1 21 11.5z"/></svg>',
                mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'};
        var shareCss=document.createElement("style");
        shareCss.textContent="#tjt-share{display:none;gap:6px;padding:0 13px 10px;flex-wrap:wrap;}"
          +"#tjt-share.on{display:flex;}"
          +"#tjt-share button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 12px;"
          +"border:1px solid rgba(47,167,110,.35);border-radius:999px;background:rgba(47,167,110,.1);color:#7fe0ad;"
          +"font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}"
          +"#tjt-share button:hover{background:rgba(47,167,110,.22);}"
          +"#tjt-share button.ok{background:#2fa76e;color:#04140c;}"
          +"#tjt-share svg{width:14px;height:14px;}";
        document.head.appendChild(shareCss);
        var shareBar=document.createElement("div"); shareBar.id="tjt-share";
        var cB=document.createElement("button"); cB.type="button"; cB.innerHTML=SI.copy+"Copy";
        cB.onclick=async function(){
          var t=transcript(); if(!t) return;
          var ok=function(){var o=cB.innerHTML;cB.classList.add("ok");cB.innerHTML=SI.copy+"Copied";
            setTimeout(function(){cB.innerHTML=o;cB.classList.remove("ok");},1600);};
          try{ await navigator.clipboard.writeText(t); ok(); }
          catch(e){ var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
            ta.style.cssText="position:absolute;left:-9999px"; document.body.appendChild(ta);
            ta.select(); ta.setSelectionRange(0,999999);
            try{ document.execCommand("copy"); ok(); }catch(e2){ alert("Could not copy automatically — press and hold to select."); }
            ta.remove(); }
        };
        var tB=document.createElement("button"); tB.type="button"; tB.innerHTML=SI.text+"Text it";
        tB.onclick=function(){ var t=transcript(); if(!t) return;
          var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
          location.href="sms:"+(iOS?"&":"?")+"body="+encodeURIComponent(t); };
        var eB=document.createElement("button"); eB.type="button"; eB.innerHTML=SI.mail+"Email it";
        eB.onclick=function(){ var t=transcript(); if(!t) return;
          location.href="mailto:?subject="+encodeURIComponent("My Ask Tara conversation — T&J Peptides")+"&body="+encodeURIComponent(t); };
        shareBar.appendChild(cB); shareBar.appendChild(tB); shareBar.appendChild(eB);
        // `.tjt-foot` is built inside panel.innerHTML — there is no `foot` variable.
        // I wrote one anyway; it would have thrown ReferenceError and killed the
        // whole widget. The Shop's gate only parsed the React block, so it passed.
        var footEl = panel.querySelector(".tjt-foot");
        if (footEl && footEl.parentNode) footEl.parentNode.insertBefore(shareBar, footEl);
        window.__tjtShare=function(){ shareBar.classList.toggle("on", msgs.querySelectorAll(".tjt-b.me").length>0); };

        // keep the FAB clear of the sticky cart bar
        function reposition(){var cart=document.getElementById("tj-cartbar");var b=cart?90:20;fab.style.bottom=b+"px";}
        setInterval(reposition,600);reposition();
      })();
    </script>
